<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户安全 - 迎鲤酒店智能助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1a365d;
            --accent-gold: #d4af37;
            --white: #ffffff;
            --text-dark: #2d3748;
            --text-light: #718096;
            --bg-light: #f7fafc;
            --border-color: #e2e8f0;
            --shadow-subtle: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 4px 12px rgba(0, 0, 0, 0.1);
            --shadow-gold: 0 4px 20px rgba(212, 175, 55, 0.15);
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #2c5282 100%);
            padding: 20px;
            position: relative;
            box-shadow: var(--shadow-medium);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--white);
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 0.5px;
        }

        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .section {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-subtle);
            animation: slideUp 0.5s ease-out backwards;
        }

        .section:nth-child(1) {
            animation-delay: 0.1s;
        }

        .section:nth-child(2) {
            animation-delay: 0.2s;
        }

        .section:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--bg-light);
        }

        .section-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #ecc94b 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--white);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--primary-blue);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: #e53e3e;
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Source Sans Pro', sans-serif;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-light);
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        .input-group .form-input {
            flex: 1;
        }

        .verify-btn {
            padding: 0 20px;
            background: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .verify-btn:hover {
            background: #2c5282;
        }

        .verify-btn:disabled {
            background: var(--text-light);
            cursor: not-allowed;
        }

        .password-strength {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .strength-bars {
            display: flex;
            gap: 4px;
        }

        .strength-bar {
            width: 40px;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-bar.weak {
            background: #e53e3e;
        }

        .strength-bar.medium {
            background: var(--accent-gold);
        }

        .strength-bar.strong {
            background: #38a169;
        }

        .strength-text {
            font-size: 12px;
            font-weight: 600;
        }

        .strength-text.weak {
            color: #e53e3e;
        }

        .strength-text.medium {
            color: var(--accent-gold);
        }

        .strength-text.strong {
            color: #38a169;
        }

        .current-phone {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-light);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .phone-number {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .edit-phone-btn {
            padding: 8px 16px;
            background: var(--accent-gold);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .edit-phone-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-gold);
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-blue) 0%, #2c5282 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Source Sans Pro', sans-serif;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 14px;
            color: var(--text-light);
        }

        .info-value {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: toastSlide 0.3s ease-out;
        }

        @keyframes toastSlide {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .toast.success {
            background: #38a169;
            color: var(--white);
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
        }

        .toast.error {
            background: #e53e3e;
            color: var(--white);
            box-shadow: 0 4px 12px rgba(229, 62, 62, 0.3);
        }

        .toast-icon {
            width: 20px;
            height: 20px;
        }

        .error-msg {
            color: #e53e3e;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <button class="back-btn" onclick="goBack()">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
            <h1 class="page-title">账户安全</h1>
        </div>
    </header>

    <main class="main-container">
        <section class="section">
            <div class="section-header">
                <div class="section-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
                <h2 class="section-title">修改密码</h2>
            </div>

            <div class="form-group">
                <label>当前密码<span class="required">*</span></label>
                <input type="password" class="form-input" id="currentPassword" placeholder="请输入当前密码">
            </div>

            <div class="form-group">
                <label>新密码<span class="required">*</span></label>
                <input type="password" class="form-input" id="newPassword" placeholder="请输入新密码" oninput="checkPasswordStrength()">
                <div class="password-strength" id="passwordStrength" style="display: none;">
                    <div class="strength-bars">
                        <div class="strength-bar" id="strengthBar1"></div>
                        <div class="strength-bar" id="strengthBar2"></div>
                        <div class="strength-bar" id="strengthBar3"></div>
                    </div>
                    <span class="strength-text" id="strengthText">弱</span>
                </div>
            </div>

            <div class="form-group">
                <label>确认新密码<span class="required">*</span></label>
                <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入新密码" oninput="checkPasswordMatch()">
                <div class="error-msg" id="passwordError">两次输入的密码不一致</div>
            </div>

            <button class="save-btn" onclick="changePassword()">确认修改</button>
        </section>

        <section class="section">
            <div class="section-header">
                <div class="section-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 17h-4v-4h-4v4h-4v-4h-4v4H6v-4H2v4c0 1.1.9 2 2 2h4v4h4v-4h4v4h4v-4h4c1.1 0 2-.9 2-2v-4h-4v-4zm-4 9H6v-1.5h12V26z"/>
                    </svg>
                </div>
                <h2 class="section-title">手机号绑定</h2>
            </div>

            <div class="current-phone" id="currentPhoneDisplay">
                <span class="phone-number">138****8888</span>
                <button class="edit-phone-btn" onclick="togglePhoneEdit()">修改</button>
            </div>

            <div id="phoneEditForm" style="display: none;">
                <div class="form-group">
                    <label>新手机号<span class="required">*</span></label>
                    <div class="input-group">
                        <input type="tel" class="form-input" id="newPhone" placeholder="请输入新手机号" maxlength="11">
                        <button class="verify-btn" id="sendCodeBtn" onclick="sendVerifyCode()">获取验证码</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>验证码<span class="required">*</span></label>
                    <input type="text" class="form-input" id="verifyCode" placeholder="请输入验证码" maxlength="6">
                </div>

                <button class="save-btn" onclick="updatePhone()">确认绑定</button>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <div class="section-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C8.14 2 5 5.14 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                </div>
                <h2 class="section-title">安全提示</h2>
            </div>

            <div class="login-info">
                <div class="info-item">
                    <span class="info-label">上次登录时间</span>
                    <span class="info-value">2024-04-26 14:30</span>
                </div>
                <div class="info-item">
                    <span class="info-label">登录地点</span>
                    <span class="info-value">上海市</span>
                </div>
                <div class="info-item">
                    <span class="info-label">登录设备</span>
                    <span class="info-value">Chrome / Windows</span>
                </div>
                <div class="info-item">
                    <span class="info-label">IP地址</span>
                    <span class="info-value">192.168.1.***</span>
                </div>
            </div>
        </section>
    </main>

    <script src="api.js"></script>
    <script>
        function goBack() {
            window.location.href = 'profile.html';
        }

        async function loadAccountInfo() {
            try {
                const info = await apiRequest('/account/info');
                if (info.phone) {
                    document.querySelector('.phone-number').textContent = info.phone;
                }
                if (info.lastLogin) {
                    const infoItems = document.querySelectorAll('.info-value');
                    if (infoItems[0]) infoItems[0].textContent = info.lastLogin.time ? info.lastLogin.time.replace('T', ' ').substring(0, 16) : '-';
                    if (infoItems[1]) infoItems[1].textContent = info.lastLogin.location || '-';
                    if (infoItems[2]) infoItems[2].textContent = info.lastLogin.device || '-';
                    if (infoItems[3]) infoItems[3].textContent = info.lastLogin.ip || '-';
                }
            } catch (e) {
                console.error('加载账户信息失败', e);
            }
        }

        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strengthEl = document.getElementById('passwordStrength');
            const bars = [
                document.getElementById('strengthBar1'),
                document.getElementById('strengthBar2'),
                document.getElementById('strengthBar3')
            ];
            const textEl = document.getElementById('strengthText');

            if (password.length === 0) {
                strengthEl.style.display = 'none';
                return;
            }

            strengthEl.style.display = 'flex';
            let strength = 0;

            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[!@#$%^&*]/.test(password)) strength++;

            if (strength <= 1) {
                textEl.textContent = '弱';
                textEl.className = 'strength-text weak';
                bars[0].className = 'strength-bar weak';
                bars[1].className = 'strength-bar';
                bars[2].className = 'strength-bar';
            } else if (strength <= 2) {
                textEl.textContent = '中';
                textEl.className = 'strength-text medium';
                bars[0].className = 'strength-bar medium';
                bars[1].className = 'strength-bar medium';
                bars[2].className = 'strength-bar';
            } else {
                textEl.textContent = '强';
                textEl.className = 'strength-text strong';
                bars[0].className = 'strength-bar strong';
                bars[1].className = 'strength-bar strong';
                bars[2].className = 'strength-bar strong';
            }
        }

        function checkPasswordMatch() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('passwordError');

            if (confirmPassword && newPassword !== confirmPassword) {
                errorEl.classList.add('show');
            } else {
                errorEl.classList.remove('show');
            }
        }

        async function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!currentPassword || !newPassword || !confirmPassword) {
                showToast('请填写完整信息', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }

            if (newPassword.length < 8) {
                showToast('密码长度至少8位', 'error');
                return;
            }

            try {
                await apiRequest('/account/password', {
                    method: 'POST',
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                showToast('密码修改成功！', 'success');
                setTimeout(() => {
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                    document.getElementById('passwordStrength').style.display = 'none';
                }, 1500);
            } catch (error) {
                showToast(error.message || '密码修改失败', 'error');
            }
        }

        function togglePhoneEdit() {
            const displayEl = document.getElementById('currentPhoneDisplay');
            const formEl = document.getElementById('phoneEditForm');

            if (displayEl.style.display === 'none') {
                displayEl.style.display = 'flex';
                formEl.style.display = 'none';
            } else {
                displayEl.style.display = 'none';
                formEl.style.display = 'block';
            }
        }

        let countdown = 0;
        async function sendVerifyCode() {
            const newPhone = document.getElementById('newPhone').value;
            const btn = document.getElementById('sendCodeBtn');

            if (!/^1[3-9]\d{9}$/.test(newPhone)) {
                showToast('请输入正确的手机号', 'error');
                return;
            }

            btn.disabled = true;
            countdown = 60;
            btn.textContent = `${countdown}秒后重发`;

            const timer = setInterval(() => {
                countdown--;
                btn.textContent = `${countdown}秒后重发`;

                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                }
            }, 1000);

            try {
                await apiRequest('/account/sms/send', {
                    method: 'POST',
                    body: JSON.stringify({ phone: newPhone })
                });
                showToast('验证码已发送', 'success');
            } catch (error) {
                showToast(error.message || '发送验证码失败', 'error');
                clearInterval(timer);
                btn.disabled = false;
                btn.textContent = '获取验证码';
            }
        }

        async function updatePhone() {
            const newPhone = document.getElementById('newPhone').value;
            const verifyCode = document.getElementById('verifyCode').value;

            if (!newPhone || !verifyCode) {
                showToast('请填写完整信息', 'error');
                return;
            }

            if (!/^1[3-9]\d{9}$/.test(newPhone)) {
                showToast('请输入正确的手机号', 'error');
                return;
            }

            if (verifyCode.length !== 6) {
                showToast('验证码格式不正确', 'error');
                return;
            }

            try {
                await apiRequest('/account/phone/update', {
                    method: 'POST',
                    body: JSON.stringify({ phone: newPhone, code: verifyCode })
                });
                showToast('手机号绑定成功！', 'success');
                setTimeout(() => {
                    document.querySelector('.phone-number').textContent = 
                        newPhone.substring(0, 3) + '****' + newPhone.substring(7);
                    togglePhoneEdit();
                    document.getElementById('newPhone').value = '';
                    document.getElementById('verifyCode').value = '';
                }, 1500);
            } catch (error) {
                showToast(error.message || '绑定失败', 'error');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' 
                ? '<svg class="toast-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>'
                : '<svg class="toast-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';
            
            toast.innerHTML = `${icon}<span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        if (checkAuth()) {
            window.addEventListener('load', loadAccountInfo);
        }
    </script>
</body>
</html>
