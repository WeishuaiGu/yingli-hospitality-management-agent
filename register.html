<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 智酒店管家</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1a365d;
            --accent-gold: #d4af37;
            --white: #ffffff;
            --text-dark: #2d3748;
            --text-light: #718096;
            --bg-light: #f7fafc;
            --border-color: #e2e8f0;
            --shadow-subtle: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-medium: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow-medium);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: var(--primary-blue);
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
        }

        .progress-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
            background: var(--bg-light);
        }

        .progress-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        .progress-step.active {
            color: var(--primary-blue);
            font-weight: 600;
        }

        .progress-step.completed {
            color: var(--accent-gold);
        }

        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--border-color);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .progress-step.active .step-number {
            background: var(--primary-blue);
            color: var(--white);
        }

        .progress-step.completed .step-number {
            background: var(--accent-gold);
            color: var(--white);
        }

        .form-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .step {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .step-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .step-description {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .required {
            color: #e53e3e;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="tel"],
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-dark);
            transition: all 0.3s ease;
            font-family: 'Source Sans Pro', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-light);
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .checkbox-option:hover {
            border-color: var(--primary-blue);
            background: var(--bg-light);
        }

        .checkbox-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .radio-option:hover {
            border-color: var(--primary-blue);
            background: var(--bg-light);
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .room-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .room-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .room-input input {
            width: 80px;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .room-input input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .staff-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .staff-input {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .staff-input label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .staff-input input {
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .staff-input input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .footer {
            padding: 20px 30px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Source Sans Pro', sans-serif;
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-dark);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #2c5282 100%);
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 54, 93, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .back-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            color: var(--accent-gold);
        }

        .gold-line {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 6px;
            font-style: italic;
        }

        .success-animation {
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .success-icon svg {
            width: 40px;
            height: 40px;
            fill: var(--white);
        }

        .success-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--primary-blue);
            margin-bottom: 12px;
        }

        .success-message {
            font-size: 15px;
            color: var(--text-light);
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="header">
            <div class="logo">智酒店管家</div>
            <div class="subtitle">完成注册，开启智能经营之旅</div>
        </div>

        <div class="progress-bar">
            <div class="progress-step active" data-step="1">
                <div class="step-number">1</div>
                <span>基本信息</span>
            </div>
            <div class="progress-step" data-step="2">
                <div class="step-number">2</div>
                <span>房间配置</span>
            </div>
            <div class="progress-step" data-step="3">
                <div class="step-number">3</div>
                <span>人员配置</span>
            </div>
            <div class="progress-step" data-step="4">
                <div class="step-number">4</div>
                <span>管理背景</span>
            </div>
            <div class="progress-step" data-step="5">
                <div class="step-number">5</div>
                <span>预算信息</span>
            </div>
        </div>

        <div class="form-content">
            <!-- Step 1: Basic Info -->
            <div class="step active" id="step1">
                <h3 class="step-title">您酒店的基本信息</h3>
                <p class="step-description">这些信息的填写有助于我们更好的辅助您经营，请仔细填写。</p>

                <div class="form-group">
                    <label>手机号码 <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="请输入手机号码" required>
                </div>

                <div class="form-group">
                    <label>验证码 <span class="required">*</span></label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="code" placeholder="请输入验证码" required style="flex: 1;">
                        <button type="button" class="btn btn-secondary" onclick="sendCode()" style="white-space: nowrap;">获取验证码</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>酒店名称 <span class="required">*</span></label>
                    <input type="text" id="hotelName" placeholder="请按对外展示的全称填写" required>
                </div>

                <div class="form-group">
                    <label>附件（可选）</label>
                    <div class="checkbox-group">
                        <label class="checkbox-option">
                            <input type="checkbox" name="attachments" value="negative">
                            <span>近30天差评Top截图</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="attachments" value="schedule">
                            <span>近期人事编制/排班</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="attachments" value="maintenance">
                            <span>翻改/维保记录摘要</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="attachments" value="competitor">
                            <span>内部竞品清单</span>
                        </label>
                    </div>
                    <p class="hint">上传相关资料可以帮助我们更好地了解您的酒店情况</p>
                </div>
            </div>

            <!-- Step 2: Room Configuration -->
            <div class="step" id="step2">
                <h3 class="step-title">房间配置信息</h3>
                <p class="step-description">该酒店有多少可售房间数呢？（实际可售房量；无该房型填0）</p>

                <div class="form-group">
                    <label>房间类型及数量 <span class="required">*</span></label>
                    <div class="room-inputs">
                        <div class="room-input">
                            <label>总数</label>
                            <input type="number" id="totalRooms" min="0" placeholder="0" required>
                        </div>
                        <div class="room-input">
                            <label>大床房</label>
                            <input type="number" id="kingRooms" min="0" placeholder="0">
                        </div>
                        <div class="room-input">
                            <label>标准间</label>
                            <input type="number" id="twinRooms" min="0" placeholder="0">
                        </div>
                        <div class="room-input">
                            <label>家庭房</label>
                            <input type="number" id="familyRooms" min="0" placeholder="0">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 3: Staff Configuration -->
            <div class="step" id="step3">
                <h3 class="step-title">人员配置信息</h3>
                <p class="step-description">该酒店现有多少员工呢？（如含外包可备注）</p>

                <div class="form-group">
                    <label>各部门人员配置 <span class="required">*</span></label>
                    <div class="staff-inputs">
                        <div class="staff-input">
                            <label>在岗总人数</label>
                            <input type="number" id="totalStaff" min="0" placeholder="0" required>
                        </div>
                        <div class="staff-input">
                            <label>前台</label>
                            <input type="number" id="frontDesk" min="0" placeholder="0">
                        </div>
                        <div class="staff-input">
                            <label>客房</label>
                            <input type="number" id="housekeeping" min="0" placeholder="0">
                        </div>
                        <div class="staff-input">
                            <label>餐厅</label>
                            <input type="number" id="restaurant" min="0" placeholder="0">
                        </div>
                        <div class="staff-input">
                            <label>维保</label>
                            <input type="number" id="maintenance" min="0" placeholder="0">
                        </div>
                        <div class="staff-input">
                            <label>行政</label>
                            <input type="number" id="admin" min="0" placeholder="0">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>备注（可选）</label>
                    <textarea id="staffRemark" placeholder="如包含外包等特殊情况，请在此说明"></textarea>
                </div>
            </div>

            <!-- Step 4: Management Background -->
            <div class="step" id="step4">
                <h3 class="step-title">店长管理经历</h3>
                <p class="step-description">该酒店店长过往管理经历是怎么样的？（可多选）</p>

                <div class="form-group">
                    <label>管理经历 <span class="required">*</span></label>
                    <div class="checkbox-group">
                        <label class="checkbox-option">
                            <input type="checkbox" name="management" value="chain">
                            <span>连锁酒店</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="management" value="star">
                            <span>星级酒店</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="management" value="single">
                            <span>单体酒店</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="management" value="internal">
                            <span>内部晋升</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="management" value="none">
                            <span>无相关经验</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="management" value="other">
                            <span>其他</span>
                        </label>
                    </div>
                </div>

                <div class="form-group" id="otherManagementGroup" style="display: none;">
                    <label>其他管理经历描述（可选）</label>
                    <textarea id="otherManagement" placeholder="请简述其他管理经历"></textarea>
                </div>
            </div>

            <!-- Step 5: Budget Information -->
            <div class="step" id="step5">
                <h3 class="step-title">公关费用预算</h3>
                <p class="step-description">您是否有对公关费用进行预算？（如不便可选"不便透露"，也可填区间）</p>

                <div class="form-group">
                    <label>预算情况 <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="budget" value="yes" required>
                            <span>有预算</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="budget" value="no">
                            <span>无预算</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="budget" value="undisclosed">
                            <span>不便透露</span>
                        </label>
                    </div>
                </div>

                <div class="form-group" id="budgetAmountGroup" style="display: none;">
                    <label>预算金额（可选）</label>
                    <input type="text" id="budgetAmount" placeholder="请填写年度或季度金额/区间，如：50-80万/年">
                </div>
            </div>

            <!-- Success Step -->
            <div class="step" id="stepSuccess">
                <div class="success-animation">
                    <div class="success-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                        </svg>
                    </div>
                    <h3 class="success-title">注册成功！</h3>
                    <p class="success-message">欢迎加入智酒店管家，让我们开始您的智能经营之旅吧！</p>
                    <button type="button" class="btn btn-primary" onclick="goToHome()" style="width: 100%;">
                        进入首页
                    </button>
                </div>
            </div>
        </div>

        <div class="footer" id="formFooter">
            <button type="button" class="btn btn-secondary" id="prevBtn" onclick="previousStep()" disabled>
                上一步
            </button>
            <button type="button" class="btn btn-primary" id="nextBtn" onclick="nextStep()">
                下一步
            </button>
        </div>

        <div class="gold-line"></div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 5;

        function updateProgress() {
            document.querySelectorAll('.progress-step').forEach((step, index) => {
                step.classList.remove('active', 'completed');
                if (index + 1 < currentStep) {
                    step.classList.add('completed');
                } else if (index + 1 === currentStep) {
                    step.classList.add('active');
                }
            });
        }

        function showStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            
            if (stepNumber === 6) {
                document.getElementById('stepSuccess').classList.add('active');
                document.getElementById('formFooter').style.display = 'none';
                document.querySelector('.progress-bar').style.display = 'none';
            } else {
                document.getElementById(`step${stepNumber}`).classList.add('active');
            }

            updateProgress();

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.disabled = stepNumber === 1;
            nextBtn.textContent = stepNumber === totalSteps ? '完成注册' : '下一步';
        }

        function nextStep() {
            if (!validateCurrentStep()) {
                return;
            }

            if (currentStep < totalSteps) {
                currentStep++;
                showStep(currentStep);
            } else {
                submitForm();
            }
        }

        function previousStep() {
            if (currentStep > 1) {
                currentStep--;
                showStep(currentStep);
            }
        }

        function validateCurrentStep() {
            const currentStepElement = document.getElementById(`step${currentStep}`);
            const requiredFields = currentStepElement.querySelectorAll('input[required]');
            let isValid = true;

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    field.style.borderColor = '#e53e3e';
                    isValid = false;
                } else {
                    field.style.borderColor = '#e2e8f0';
                }
            });

            if (!isValid) {
                alert('请填写所有必填项');
            }

            return isValid;
        }

        function sendCode() {
            const phone = document.getElementById('phone').value;
            if (!phone) {
                alert('请先输入手机号码');
                return;
            }
            alert(`验证码已发送到 ${phone}`);
        }

        function submitForm() {
            alert('注册成功！正在跳转...');
            currentStep = 6;
            showStep(currentStep);
        }

        function goToHome() {
            window.location.href = 'home.html';
        }

        // Handle "Other" checkbox in management background
        document.querySelectorAll('input[name="management"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const otherGroup = document.getElementById('otherManagementGroup');
                const otherCheckbox = document.querySelector('input[name="management"][value="other"]');
                otherGroup.style.display = otherCheckbox.checked ? 'block' : 'none';
            });
        });

        // Handle budget radio buttons
        document.querySelectorAll('input[name="budget"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const budgetGroup = document.getElementById('budgetAmountGroup');
                const yesRadio = document.querySelector('input[name="budget"][value="yes"]');
                budgetGroup.style.display = yesRadio.checked ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
